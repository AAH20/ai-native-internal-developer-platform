[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "launchrail-platform-api"
version = "0.1.0"
description = "AI-native internal developer platform control plane"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Ahmed Hassan"}]
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "SQLAlchemy==2.0.43",
  "psycopg[binary]==3.2.13",
  "pydantic-settings==2.10.1",
  "PyJWT[crypto]==2.10.1",
  "prometheus-client==0.22.1"
]

[project.scripts]
launchrail-api = "platform_api.run:main"

[tool.setuptools.packages.find]
include = ["platform_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
